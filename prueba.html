    const contenedor = document.getElementById('horario');

    // Obtener todas las horas únicas
    const horas = new Set();
    data.forEach(d => {
      Object.keys(d.bloques).forEach(h => horas.add(h));
    });

    const horasOrdenadas = Array.from(horas).sort();

    // Crear tabla
    const tabla = document.createElement('table');

    // Encabezado
    const header = document.createElement('tr');
    header.innerHTML = `<th>Hora</th>`;
    data.forEach(d => {
      header.innerHTML += `<th>Día ${d.dia} / Mes ${d.mes}</th>`;
    });
    tabla.appendChild(header);

    // Filas por hora
    horasOrdenadas.forEach(hora => {
      const fila = document.createElement('tr');
      fila.innerHTML = `<td>${hora}</td>`;

      data.forEach(d => {
        const nombre = d.bloques[hora] || '';
        fila.innerHTML += `<td>${nombre}</td>`;
      });

      tabla.appendChild(fila);
    });

    contenedor.appendChild(tabla);
